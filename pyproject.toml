[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "hsm-to-python"
version = "2.0.0"
description = "Python programs of the CyberiadaML state machine diagrams on the HSM dispatcher"
readme = "README.md"
requires-python = ">=3.8"
authors = [{name = "Alexey Fedoseev", email = "aleksey@fedoseev.net"}]
dependencies = ["hsm-dispatcher-py"]
classifiers = [
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
]

# hsm-dispatcher-py (the hsmd module) and the CyberiadaML module of
# libcyberiadamlpp-py are required as well; both are installed from their
# own source trees, not from a package index

[project.scripts]
hsm-run = "hsm:run"
hsm-gencode = "gencode:run"
hsm-check = "hsmcheck:run"

[tool.setuptools]
py-modules = ["gencode", "hsm", "hsmcheck", "hsmplugin"]

# the editor plugin under the install prefix; hsm-run --install-editor-plugin
# copies it into the plugin folder of the editor
[tool.setuptools.data-files]
"share/cyberiada-pro/plugins/hsm-to-python" = ["editor-plugin/plugin.json"]
"share/cyberiada-pro/plugins/hsm-to-python/i18n" = ["editor-plugin/i18n/ru.json"]
"share/cyberiada-pro/plugins/hsm-to-python/icons" = [
    "editor-plugin/icons/check.svg", "editor-plugin/icons/generate.svg",
    "editor-plugin/icons/run.svg", "editor-plugin/icons/step.svg"]
